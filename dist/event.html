<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/styles.min.css" />
  <title>Lenni</title>
</head>

<body class="body">
  <header class="page-header">
    <div class="page-header__container">
      <a class="page-header__logo" href="#">
        <svg class="page-header__logo-icon" width="202" height="147">
          <use xlink:href="assets/icons/symbols.svg#logo"></use>
        </svg>
      </a>
      <nav class="page-header__nav">
        <a class="page-header__nav-link" href="events.html">Мероприятия</a>
        <a class="page-header__nav-link" href="#">Блог</a>
        <a class="page-header__nav-link" href="#">О нас</a>
        <a class="page-header__nav-link" href="#">Контакты</a>
      </nav>
      <div class="page-header__right-block">
        <a class="page-header__user-link btn" href="#">Войти</a>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="event">
      <form class="reserve" action="">
        <div class="reserve__first-row">
          <div class="reserve__item reserve__tables-list">
            <h4 class="reserve__title">Забронировать столик</h4>

            <label class="checkbox-list-row checkbox-list-row--red">
              <input class="checkbox checkbox--red" type="checkbox">
              <span class="checkbox-text checkbox-text--red">1 стол</span>
            </label>
            <label class="checkbox-list-row checkbox-list-row">
              <input class="checkbox checkbox" type="checkbox">
              <span class="checkbox-text checkbox-text">2 стол</span>
            </label>
            <label class="checkbox-list-row checkbox-list-row">
              <input class="checkbox checkbox" type="checkbox">
              <span class="checkbox-text checkbox-text">3 стол</span>
            </label>
            <label class="checkbox-list-row checkbox-list-row--red">
              <input class="checkbox checkbox--red" type="checkbox">
              <span class="checkbox-text checkbox-text--red">4 стол</span>
            </label>
            <label class="checkbox-list-row checkbox-list-row">
              <input class="checkbox checkbox" type="checkbox">
              <span class="checkbox-text checkbox-text">5 стол</span>
            </label>
            <label class="checkbox-list-row checkbox-list-row">
              <input class="checkbox checkbox" type="checkbox">
              <span class="checkbox-text checkbox-text">6 стол</span>
            </label>
            <label class="checkbox-list-row checkbox-list-row--red">
              <input class="checkbox checkbox--red" type="checkbox">
              <span class="checkbox-text checkbox-text--red">7 стол</span>
            </label>
            <label class="checkbox-list-row checkbox-list-row--red">
              <input class="checkbox checkbox--red" type="checkbox">
              <span class="checkbox-text checkbox-text--red">8 стол</span>
            </label>
            <label class="checkbox-list-row checkbox-list-row--red">
              <input class="checkbox checkbox--red" type="checkbox">
              <span class="checkbox-text checkbox-text--red">9 стол</span>
            </label>
            <label class="checkbox-list-row checkbox-list-row">
              <input class="checkbox checkbox" type="checkbox">
              <span class="checkbox-text checkbox-text">10 стол</span>
            </label>
            <label class="checkbox-list-row checkbox-list-row">
              <input class="checkbox checkbox" type="checkbox">
              <span class="checkbox-text checkbox-text">11 стол</span>
            </label>
          </div>
          <div class="reserve__item reserve__map">
            <h4 class="reserve__title reserve__title--scene">Сцена</h4>
            <svg class="reserve__map-icon">
              <use xlink:href="assets/icons/symbols.svg#map"></use>
            </svg>
          </div>
        </div>

        <div class="reserve__second-row">
          <div class="reserve__item reserve__check">
            <h4 class="reserve__title">Ваши пригласительные билеты</h4>
            <div class="check-row">
              <p class="check-row__count">9 шт. | 1400 ₽</p>
              <p class="check-row__amount">12 600 ₽</p>
            </div>
            <div class="check-row">
              <p class="check-row__count">4 шт. | 1250 ₽</p>
              <p class="check-row__amount">5000 ₽</p>
            </div>
            <div class="check-amount">
              <p class="check-amount__sum-label">Сумма</p>
              <p class="check-amount__sum">17 600 ₽</p>
            </div>

            <button class="btn btn--red">
              Купить белеты
            </button>
          </div>

          <div class="reserve__item reserve__legend">
            <h4 class="reserve__title">Стоимость пригласительного билета</h4>
            <div class="reserve__legend-info">
              <p class="reserve__legend-info-row">
                <span class="reserve__marker reserve__marker--red"></span>
                <span>1400 ₽ | 1 персона</span>
              </p>
              <p class="reserve__legend-info-row">
                <span class="reserve__marker"></span>
                <span>1259 ₽ | 1 персона</span>
              </p>
            </div>
            <h4 class="reserve__title">Примечание</h4>
            <div class="reserve__legend-info">
              <p class="reserve__legend-info-row">
                <span class="reserve__marker reserve__circle-marker reserve__circle-marker--black-n-red"></span>
                <span>доступные места</span>
              </p>
              <p class="reserve__legend-info-row">
                <span class="reserve__marker reserve__circle-marker reserve__circle-marker--gray"></span>
                <span>забронировано</span>
              </p>
            </div>
          </div>
        </div>
      </form>
    </div>
  </main>

  <footer class="page-footer">
    <hr class="page-footer__hr">
    <div class="page-footer__container">
      footer content
    </div>
  </footer>
</body>

</html>
