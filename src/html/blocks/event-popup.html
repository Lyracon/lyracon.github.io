<div class="popup" id="event-popup">
    <div class="popup__wrapper">
        <h2 class="popup__title">
            Заполните форму<br>
            и мы подберем площадку 
        </h2>
        <div class="popup__sticky-close">
            <button class="popup__close-btn close-btn" type="button">
                <svg class=close-btn__icon width="24" height="24">
                    <use xlink:href="assets/icons/symbols.svg#x">
                </svg>
            </button>
        </div>
        <div class="popup__container">
            <form class="popup-form from">

                <div class="form__list">
                    <div class="field form__field form__field--w50">
                        <h5 class="field__title">
                            Формат мероприятия
                        </h5>
                        <div class="radio field__radio">
                            <label class="radio__item">
                                <input class="radio__input" type="radio" name="format" value="masterclass" checked>
                                <span class="radio__mark"></span>
                                <span class="radio__label">Мастер-класс/семинар</span>
                            </label>
                            <label class="radio__item">
                                <input class="radio__input" type="radio" name="format" value="concert">
                                <span class="radio__mark"></span>
                                <span class="radio__label">Концерт/выступление</span>
                            </label>
                            <label class="radio__item">
                                <input class="radio__input" type="radio" name="format" value="exhibition">
                                <span class="radio__mark"></span>
                                <span class="radio__label">Выставка/показ</span>
                            </label>
                            <label class="radio__item">
                                <input class="radio__input" type="radio" name="format" value="other">
                                <span class="radio__mark"></span>
                                <span class="radio__label">Другое</span>
                            </label>
                        </div>

                    </div>

                    <div class="form__group form__group--w50">
                        
                        <label class="field form__field">
                            <span class="field__title">
                                Планируемое количество посетителей:
                            </span>
                            <select class="field__select" name="guests-count">
                                <option value="0-20">до 20 человек</option>
                                <option value="20-100">от 20 до 100 человек</option>
                                <option value="100-500">от 100 до 500 человек</option>
                                <option value="500-infinit">более 500 человек</option>
                            </select>
                        </label>

                        <div class="field form__field form__field--m0">
                            <h5 class="field__title">
                                Дата проведения: 
                            </h5>
                            <div class="field__date">
                                <div class="field__date-inputs">
                                    <input class="field__date-input" type="text" placeholder="ДД">
                                    <input class="field__date-input" type="text" placeholder="MM">
                                    <input class="field__date-input field__date-input--year" type="text" placeholder="ГГГГ">
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
                
            
                <h5 class="form__title">
                    Контактные данные:
                </h5>
                <div class="form__list">
                    <label class="field form__field form__field--w50">
                        <span class="field__label">Имя*</span>
                        <input class="field__input" type="text" name="name" placeholder="Имя" required/>
                    </label>
                    <label class="field form__field form__field--w50">
                        <span class="field__label">Фамилия*</span>
                        <input class="field__input" type="text" name="surename" placeholder="Фамилия" required/>
                    </label>
                    <label class="field form__field form__field--w50">
                        <span class="field__label">Телефон*</span>
                        <input class="field__input" type="tel" name="phone" placeholder="+7 (___) ___ __ __" required/>
                    </label>
                    <label class="field form__field form__field--w50">
                        <span class="field__label">Email*</span>
                        <input class="field__input" type="email" name="name" placeholder="Email" required/>
                    </label>
    
                    <label class="field form__field form__field--m0">
                        <span class="field__title">
                            Есть пожелания? Напишите нам:
                        </span>
                        <textarea class="field__textarea" type="text" name="wishes"></textarea>
                    </label>

                    <label class="check">
                        <input class="check__input is-hidden" type="checkbox" name="agree" required checked>
                        <span class="check__mark"></span>
                        <span class="check__label check__label--fz14">
                            Я соглашаюсь с пользовательским соглашением и с политикой использования персональных данных
                        </span>
                    </label>

                    <div class="form__btns">
                        <button class="btn form__submit " type="submit">
                            Отправить
                        </button>
                        <button class="form__close-btn" type="button" >
                            Закрыть
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
