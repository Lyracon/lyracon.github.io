<article class="article-card @@class">
    <a class="article-card__link" href="#">
        <picture class="article-card__picture">
            <img class="article-card__img" src="@@img" alt="@@alt">
        </picture>
    </a>
    <div class="article-card__info">
        <time class="article-card__time" datetime="@@datatime">
            @@time
        </time>
        <a class="article-card__title-link" href="">
            <h4 class="article-card__title">
                @@title
            </h4>
            <span class="article-card__arrow">
                <svg class="arrow-icon" width="91" height="60">
                    <use xlink:href="assets/icons/symbols.svg#arrow"></use>
                </svg>
            </span>
        </a>
        <p class="article-card__description">@@descr</p>
    </div>
</article>
