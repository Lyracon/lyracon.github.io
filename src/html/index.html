<!DOCTYPE html>
<html lang="ru">
	@@include('blocks/head.html') 

	<body class="body">
		@@include('blocks/page-header.html')
		
		<main class="main">
			<div class="home">
				<header class="main-header home__main-header">
					<h1 class="title main-header__title">АРТ — ПРОСТРАНСТВО</h1>
					<img class="banner main-header__banner" alt="banner"/>
					<p class="citate main-header__citate">
						ДЛЯ ЛЮДЕЙ, ГОРЯЩИХ СЕРДЦЕМ И ДЕЛОМ<br>
						МЕСТО ДЛЯ НАСТОЯЩЕГО
					</p>
				</header>

				<section class="offers home__offer">
					<h4 class="offers__title">Я ХОЧУ:</h4>
					<div class="offers__btns">
						<button class="offers__btn btn btn--red" type="button">Провести мероприятие</button>
						<button class="offers__btn btn" type="button">Стать арендатором</button>
					</div>
				</section>

				<section class="about home__about">
					<h2 class="about__section-title section-title">О НАС</h2>
					<div class="about__container">
					</div>
				</section>

				<section class="upcoming home__upcoming">
					<h2 class="upcoming__section-title section-title">МЕРОПРИЯТИЯ</h2>
					<div class="upcoming__container"></div>
				</section>

				@@include('blocks/blog-listing.html', {"class": "home__listing"})

				<section class="contacts home__contacts">
					<h2 class="contacts__section-title section-title">КОНТАКТЫ</h2>
					<div class="contacts__container"></div>
				</section>


				<div class="quote">
					quote
				</div>

			</div>
		</main>

		@@include('blocks/page-footer.html')
