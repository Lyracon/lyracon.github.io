<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="utf-8">
		<link rel="stylesheet" href="styles/styles.css">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
		<title>Lenni</title>
	</head>
	<body class="body">
        <main class="main">
            <form class="reserve" action="">
                <div class="reserve__item reserve__tables-list">
                    
                    <h4 class="reserve__title">Забронировать столик</h4>
                        
                    <label class="checkbox-list-row checkbox-list-row--red">
                        <input class="checkbox checkbox--red" type="checkbox">
                        <span class="checkbox__text checkbox__text--red">1 стол</span>
                    </label>

                    <label class="checkbox-list-row">
                        <input class="checkbox" type="checkbox">
                        <span class="checkbox__text">2 стол</span>
                    </label>

                    <label class="checkbox-list-row">
                        <input class="checkbox" type="checkbox">
                        <span class="checkbox__text">3 стол</span>
                    </label>

                    <label class="checkbox-list-row checkbox-list-row--red">
                        <input class="checkbox checkbox--red" type="checkbox">
                        <span class="checkbox__text">4 стол</span>
                    </label>

                    <label class="checkbox-list-row">
                        <input class="checkbox" type="checkbox">
                        <span class="checkbox__text">5 стол</span>
                    </label>
                    
                    <label class="checkbox-list-row">
                        <input class="checkbox" type="checkbox">
                        <span class="checkbox__text">6 стол</span>
                    </label>

                    <label class="checkbox-list-row checkbox-list-row--red">
                        <input class="checkbox checkbox--red" type="checkbox">
                        <span class="checkbox__text">7 стол</span>
                    </label>

                    <label class="checkbox-list-row checkbox-list-row--red">
                        <input class="checkbox checkbox--red" type="checkbox">
                        <span class="checkbox__text">8 стол</span>
                    </label>

                    <label class="checkbox-list-row checkbox-list-row--red">
                        <input class="checkbox checkbox--red" type="checkbox">
                        <span class="checkbox__text">9 стол</span>
                    </label>

                    <label class="checkbox-list-row">
                        <input class="checkbox" type="checkbox">
                        <span class="checkbox__text">10 стол</span>
                    </label>
                    
                    <label class="checkbox-list-row">
                        <input class="checkbox" type="checkbox">
                        <span class="checkbox__text">11 стол</span>
                    </label>

                    
                </div>

                <div class="reserve__item reserve__map">
                    <h4 class="reserve__title reserve__title--scene">Сцена</h4>
                    <img class="reserve__map-img" src="images/Map.svg" alt="Map">
                </div>

                <div class="reserve__item">
                    <h4 class="reserve__title">Ваши пригласительные билеты</h4>
                    <div class="reserve__receipt-row">
                        <p class="receipt-row__count">9 шт. | 1400 ₽</p>
                        <p class="receipt-row__total">12 600 ₽</p>
                    </div>
                    <div class="reserve__receipt-row">
                        <p class="receipt-row__count">4 шт. | 1250 ₽</p>
                        <p class="receipt-row__total">5000 ₽</p>
                    </div>
                    <div class="reserve__receipt-total">
                        <p class="reserve__summ-label">Сумма</p>
                        <p class="reserve__sum">17 600 ₽</p>   
                    </div>

                    <button class="btn btn--red">
                        Купить белеты
                    </button>
                    
                </div>

                <div class="reserve__item reserve__legend">
                    <h4 class="reserve__title">Стоимость пригласительного билета</h4>
                        <div class="reserve__info">
                            <p class="reserve__info-row">
                                <span class="reserve__marker reserve__marker--red"></span>
                                <span>1400 ₽ | 1 персона</span  >
                                </p>
                                <p class="reserve__info-row">
                                <span class="reserve__marker"></span>
                                <span>1259 ₽ | 1 персона</span  >
                            </p>
                        </div>
                    <h4 class="reserve__title">Примечание</h4>
                        <div class="reserve__info">
                            <p class="reserve__info-row">
                                    <span class="reserve__marker reserve__circle-marker reserve__circle-marker--black reserve__circle-marker--sticky"></span><span class="reserve__marker reserve__circle-marker reserve__circle-marker--red"></span>
                                <span>доступные места</span>
                            </p>
                            <p class="reserve__info-row">
                                <span class="reserve__marker reserve__circle-marker reserve__circle-marker--gray"></span>
                                <span>забронировано</span>
                            </p>
                        </div>
                </div>
            </form>
        </main>
	</body>
</html>
