<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="utf-8">
		<link rel="stylesheet" href="styles/styles.css">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
		<title>Lenni</title>
	</head>
	<body class="body">
		<header class="page-header">
			<div class="page-header__container">
				<a class="page-header__logo" href="#">
					<img class="page-header__logo-icon" src="images/logo.svg" alt="logo">
				</a>
				<nav class="page-header__nav">
					<a class="page-header__nav-link" href="#">Мероприятия</a>
					<a class="page-header__nav-link" href="#">Блог</a>
					<a class="page-header__nav-link" href="#">О нас</a>
					<a class="page-header__nav-link" href="#">Контакты</a>
				</nav>
				<div class="page-header__right-block">
					<a class="page-header__user-link btn" href="#">Войти</a>
				</div>
			</div>
		</header>
		<main class="main">
			<div class="home">
				<header class="main-header home__main-header">
					<h1 class="title main-header__title">АРТ — ПРОСТРАНСТВО</h1>
					<img class="banner main-header__banner" alt="banner"/>
					<p class="citate main-header__citate">
						ДЛЯ ЛЮДЕЙ, ГОРЯЩИХ СЕРДЦЕМ И ДЕЛОМ<br>
						МЕСТО ДЛЯ НАСТОЯЩЕГО
					</p>
				</header>

				<section class="offers home__offer">
					<h4 class="offers__title">Я ХОЧУ:</h4>
					<div class="offers__btns">
						<button class="offers__btn btn btn--red" type="button">Провести мероприятие</button>
						<button class="offers__btn btn" type="button">Стать арендатором</button>
					</div>
				</section>

				<section class="about home__about">
					<h2 class="about__section-title section-title">О НАС</h2>
					<div class="about__container">
					</div>
				</section>

				<section class="upcoming home__upcoming">
					<h2 class="upcoming__section-title section-title">МЕРОПРИЯТИЯ</h2>
					<div class="upcoming__container"></div>
				</section>

				<section class="blog home__blog">
					<h2 class="blog__section-title section-title">БЛОГ</h2>
					<div class="blog__container"></div>
				</section>

				<section class="contacts home__contacts">
					<h2 class="contacts__section-title section-title">КОНТАКТЫ</h2>
					<div class="contacts__container"></div>
				</section>

				<div class="quote">
					quote
				</div>

			</div>
		</main>
		<footer class="page-footer">
			<hr class="page-footer__hr">
			<div class="page-footer__container">
				footer content
			</div>
		</footer>
	</body>
</html>
